# models/keys.toml — привязка ключей API к провайдерам и адресам.
#
# key_name — имя переменной в .env со значением ключа (значения тут не хранятся).
# provider — имя провайдера из providers.toml.
# proxies  — имена прокси из proxies.toml, через которые ходит ЭТОТ ключ;
#            порядок = порядок ротации внутри ключа.

[[keys]]
key_name = "GROQ_API_KEY"
provider = "groq"
proxies = ["auto1", "auto2"]

# Второй ключ того же провайдера — второй аккаунт на других адресах.
[[keys]]
key_name = "GROQ_API_KEY_2"
provider = "groq"
proxies = ["auto1", "auto2"]

[[keys]]
key_name = "OPENROUTER_API_KEY"
provider = "openrouter"
proxies = ["direct"]

# Для auth = "none" имя — просто имя связки, значение в .env не читается.
[[keys]]
key_name = "OLLAMA_LOCAL"
provider = "ollama"
proxies = ["direct"]

# Веб-аккаунт: key_file — путь от каталога проекта (значение из .env не читается).
# max_concurrent — параллельных ходов на связку (для веб-аккаунта по умолчанию 1).
# Пока прокси за аккаунтом не закреплён, оставь "direct"; назначишь позже.
[[keys]]
key_name = "DS_EXAMPLE"
provider = "deepseek_web"
key_file = "accounts/ds_example.json"
proxies = ["direct"]
max_concurrent = 1
